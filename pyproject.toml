[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[project]
name = "sovabids"
dynamic = ["version"]
description = "Automated eeg2bids conversion"
readme = "README.rst"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.9"
keywords = ["EEG", "eeg", "bids", "mne", "mne-bids", "conversion"]
authors = [
    { name = "sovabids developers", email = "yjmantilla@gmail.com" },
]
maintainers = [
    { name = "Yorguin Mantilla", email = "yjmantilla@gmail.com" },
]
classifiers = [
    "Topic :: Scientific/Engineering",
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Development Status :: 3 - Alpha",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Unix",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
]
dependencies = [
    "bids-validator",
    "pybv>=0.7.3",
    "mne-bids",
    "pyyaml",
    "pandas",
    "mne",
    "numpy",
    "requests",
]

[project.urls]
Documentation = "https://sovabids.readthedocs.io/en/latest/"
"Bug Reports" = "https://github.com/yjmantilla/sovabids/issues"
Source = "https://github.com/yjmantilla/sovabids"

[project.scripts]
sovapply = "sovabids.rules:sovapply"
sovaconvert = "sovabids.convert:sovaconvert"
sovatui = "sovabids.tui:main"

[project.optional-dependencies]
gui = [
    "flask",
    "uvicorn",
    "fastapi",
    "fastapi-jsonrpc>=3.4.2",
    "httpx",
    "pydantic",
]
tui = [
    "textual>=0.50.0",
]
docs = [
    "sphinx>=4.0.0",
    "insegel",
    "furo",
    "sphinx-gallery",
    "sphinx-copybutton",
    "sphinxcontrib-mermaid",
    "sphinx-autoapi",
    "myst-parser",
]
dev = [
    "pytest",
    "pytest-cov",
    "anyio",
    "sovabids[gui,tui,docs]",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"

[tool.hatch.build.targets.sdist]
exclude = ["tests/**", "front/**"]

[tool.hatch.build.targets.wheel]
exclude = ["tests/**", "front/**"]

[tool.coverage.run]
omit = ["*tests*"]
