name: python-tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11"]
        node: ["18"]
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Use Node.js ${{ matrix.node }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node }}

    - name: Install dependencies
      run: uv sync --frozen --all-extras

    - name: Install bidscoin (not on PyPI, required for sova2coin plugin tests)
      run: uv pip install "git+https://github.com/yjmantilla/bidscoin.git@sovabids"

    - name: Test with pytest
      run: uv run pytest tests/ --cov=sovabids/ --cov-report=xml --verbose -s

    - name: Build docs
      run: |
        cd docs
        uv run make clean
        uv run make html

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        slug: yjmantilla/sovabids

    - name: Upload uv.lock as artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: uv-lock-${{ github.sha }}
        path: uv.lock
        retention-days: 90

    - name: Test with web-validator
      run: /bin/bash tests/test_web_validator.sh
